<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Professional Calculator</title>
    <link rel="stylesheet" href="styles.css?v=7c8b2a">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="display">
                <div class="previous-operand" id="previous-operand"></div>
                <div class="current-operand" id="current-operand">0</div>
            </div>
            <div class="buttons">
                <button class="btn span-two" data-all-clear>AC</button>
                <button class="btn" data-delete>DEL</button>
                <button class="btn operation" data-operation="/">÷</button>
                <button class="btn" data-number>1</button>
                <button class="btn" id="btn-2" data-number>2</button>
                <button class="btn" data-number>3</button>
                <button class="btn operation" data-operation="*">×</button>
                <button class="btn" data-number>4</button>
                <button class="btn" data-number>5</button>
                <button class="btn" data-number>6</button>
                <button class="btn operation" data-operation="+">+</button>
                <button class="btn" data-number>7</button>
                <button class="btn" data-number>8</button>
                <button class="btn" data-number>9</button>
                <button class="btn operation" data-operation="-">−</button>
                <button class="btn" data-number>.</button>
                <button class="btn" data-number>0</button>
                <button class="btn span-two equal" data-equals>=</button>
            </div>
        </div>
    </div>
    <script src="script.js?v=7c8b2a"></script>
</body>
</html>
